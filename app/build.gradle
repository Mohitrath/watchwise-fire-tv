plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.watchwise.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.watchwise.tv'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}
