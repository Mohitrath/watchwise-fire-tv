<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">WatchWise TV — Less scrolling, more watching</title>
<desc id="desc">A dark midnight-blue streaming discovery dashboard with mint accents, catalogue cards, and a television-inspired visual identity.</desc>
